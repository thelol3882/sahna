<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Remote</title>
<style>
/* Phone first, one hand: status and text at the top, the big Next under the thumb at the bottom. */
:root {
  --bg: #F5F3EF; --surface: #FFFFFF; --ink: #141A26; --muted: #646C7E; --faint: #A4AAB8; --line: #E1DDD5;
  --accent: #2F5BEA; --on-accent: #FFFFFF; --turn: #D9622B; --turn-soft: #FBE9DF; --good: #2E8A57; --bad: #C63A2F; --rec: #D32F2F;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --size: 24px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0F1420; --surface: #182031; --ink: #EDF0F6; --muted: #9AA3B8; --faint: #5B6479; --line: #273046;
  --accent: #5C82FF; --turn: #FF8B52; --turn-soft: #3A2417; --good: #5CC38A; --bad: #FF7A6B; --rec: #FF5A52; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.screen { height: 100dvh; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

/* who are you */
.pick { justify-content: flex-end; gap: 10px; }
.pick h1 { font-size: 26px; margin: 0; }
.pick p { margin: 0 0 8px; color: var(--muted); }
.pick button { text-align: left; font-size: 20px; font-weight: 650; padding: 18px 20px; border-radius: 16px; min-height: 60px;
  border: 1px solid var(--line); background: var(--surface); display: flex; justify-content: space-between; align-items: center; }
.pick button span { color: var(--muted); font: 500 14px var(--mono); }
.pick .watch { background: transparent; border-style: dashed; }

/* main */
.main { gap: 12px; }
.top { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); min-height: 36px; }
.who { background: none; border: 0; padding: 6px 0; font-weight: 600; color: var(--muted); max-width: 36%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who b { color: var(--ink); }
.conn { display: flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.conn i { width: 9px; height: 9px; border-radius: 50%; background: var(--good); }
.conn.off i { background: var(--bad); animation: blink 1s infinite; }
.conn.off { color: var(--bad); }
@keyframes blink { 50% { opacity: .25; } }
.chip { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-weight: 700; color: var(--muted); min-height: 36px; }
.mic { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.mic.on { border-color: var(--turn); color: var(--turn); }
.mic .lv { width: 30px; height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
.mic .lv i { display: block; height: 100%; width: 0; background: var(--turn); }
.recbar { display: flex; align-items: center; gap: 10px; background: var(--rec); color: #fff; border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 15px; }
.recbar i { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
.recbar span:last-child { margin-left: auto; font: 600 13px var(--mono); opacity: .9; }
.setup { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.setup summary { font-weight: 700; cursor: pointer; list-style: none; }
.setup summary::-webkit-details-marker { display: none; }
.setup label { display: flex; gap: 10px; align-items: center; min-height: 40px; }
.setup input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.setup .ok { color: var(--good); }
.setup .warn { color: var(--bad); }
.setup button { border: 1px solid var(--line); background: none; border-radius: 10px; min-height: 40px; padding: 0 12px; font-weight: 700; }
.status { font-size: 22px; font-weight: 750; line-height: 1.25; }
.status small { display: block; font-size: 15px; font-weight: 500; color: var(--muted); margin-top: 3px; }
.status.mine { color: var(--turn); }
.status.soon small { color: var(--turn); font-weight: 650; }
.where { display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 600 12px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.where span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots { display: flex; gap: 5px; flex: none; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.read { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-user-select: text; user-select: text; padding: 2px 0; }
.read p { margin: 0 0 14px; font-size: var(--size); line-height: 1.45; font-weight: 500; }
.read p.mine { background: var(--turn-soft); border-left: 4px solid var(--turn); padding: 10px 12px; border-radius: 10px; font-weight: 600; }
.read p.quiet { color: var(--faint); font-size: calc(var(--size) * .8); }
.read p.after { color: var(--muted); font-size: calc(var(--size) * .8); }
.read p.after::before { content: "Then: "; font-weight: 700; }
.read p.empty { color: var(--turn); font-weight: 700; }
.hint { font-size: 15px; font-weight: 650; color: var(--turn); }
.media { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.media .line { display: flex; justify-content: space-between; gap: 8px; font: 600 14px var(--mono); color: var(--muted); }
.media .line b { color: var(--ink); font-family: var(--font); font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.media .track { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.media .track i { display: block; height: 100%; background: var(--turn); width: 0; }
.replay { background: none; border: 1px dashed var(--line); border-radius: 14px; min-height: 48px; font-size: 16px; font-weight: 600; color: var(--muted); }
.bar { display: flex; gap: 10px; align-items: stretch; flex: none; }
.back { flex: 0 0 26%; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; font-size: 20px; font-weight: 700; color: var(--muted); min-height: 120px; }
.next { flex: 1 1 auto; border: 0; border-radius: 22px; min-height: 120px; font-size: 26px; font-weight: 800; background: var(--accent); color: var(--on-accent); transition: transform .08s, opacity .2s; }
.bar.mine .next { background: var(--turn); }
.next:disabled, .back:disabled { opacity: .35; }
.next.sent { transform: scale(.97); opacity: .8; }
.next small { display: block; font-size: 14px; font-weight: 600; opacity: .85; margin-top: 4px; }
.flash { position: fixed; inset: 0; pointer-events: none; background: var(--turn); opacity: 0; }
.flash.go { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }
.cover { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 28px; text-align: center; }
.cover.count { background: rgba(0,0,0,.82); color: #fff; }
.cover.count b { font-size: 140px; line-height: 1; font-weight: 800; }
.cover.alert { background: var(--rec); color: #fff; }
.cover.alert h2 { margin: 0; font-size: 28px; }
.cover.alert p { margin: 0; font-size: 18px; line-height: 1.4; }
.cover button { min-height: 64px; min-width: 70%; border: 0; border-radius: 18px; font-size: 20px; font-weight: 800; background: #fff; color: #111; }
@media (prefers-reduced-motion: reduce) { .next.sent { transform: none; } .flash.go { animation-duration: .01s; } .conn.off i, .recbar i { animation: none; } }
@media (max-height: 600px) { .back, .next { min-height: 84px; } }
</style>
</head>
<body>

<div class="screen pick" id="pick" hidden>
  <h1 id="pickTitle">Remote</h1>
  <p>Who are you? Your Next button works while your part is on screen.</p>
  <div id="pickList" style="display:flex;flex-direction:column;gap:10px"></div>
  <button data-part="0" class="watch" id="pickWatch">Just watch</button>
</div>

<div class="screen main" id="main" hidden>
  <div class="top">
    <button class="who" id="who" aria-label="Change who you are"></button>
    <span class="conn off" id="conn" role="status"><i></i><span id="connText">connecting</span></span>
    <button class="chip mic" id="mic" aria-label="Turn on my microphone" aria-pressed="false" hidden><span id="micText">Mic</span> <span class="lv"><i id="micLv"></i></span></button>
    <button class="chip" id="aa" aria-label="Text size">Aa</button>
  </div>
  <div class="recbar" id="recbar" hidden><i></i><span id="recText">REC</span><span id="recUp"></span></div>
  <details class="setup" id="setup" hidden>
    <summary id="setupSum">Before the recording</summary>
    <label><span id="micState" class="warn">Microphone: not allowed yet</span><button id="micTest" style="margin-left:auto">Allow</button></label>
    <label><input type="checkbox" id="hp"> I wear headphones (other voices must not reach this phone)</label>
    <label><input type="checkbox" id="meet"> The call runs on my laptop, not on this phone</label>
    <span style="color:var(--muted)">Keep this page open with the screen on while recording. If you leave it, the recording stops until you come back.</span>
  </details>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="where"><span id="where"></span><span class="dots" id="dots"></span></div>
  <div class="read" id="read"></div>
  <div class="hint" id="hint"></div>
  <div class="media" id="media" hidden>
    <div class="line"><b id="mChapter"></b><span id="mTime"></span></div>
    <div class="track"><i id="mBar"></i></div>
  </div>
  <button class="replay" id="replay" hidden>Replay the intro</button>
  <div class="bar" id="bar">
    <button class="back" id="back" aria-label="Back one step">Back</button>
    <button class="next" id="fwd">Next</button>
  </div>
</div>
<div class="flash" id="flash"></div>
<div class="cover count" id="count" hidden><span>Recording starts in</span><b id="countN">3</b><span>Stay quiet for the beep</span></div>
<div class="cover alert" id="alert" hidden><h2 id="alertH"></h2><p id="alertP"></p><button id="alertBtn">OK</button></div>

<script>
// Filled by server.mjs: { title, speakers: [{ part, name }], scenes: [{ id, title, speaker, part, chunks }], recording: {...} }
const DATA = __DATA__;
let SCENES = DATA.scenes || [];
let SPEAKERS = DATA.speakers || [];
const RECCFG = DATA.recording || {};
const SIZES = [20, 24, 30];
const key = new URLSearchParams(location.search).get("k") || "";
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const nameOf = (p) => (SPEAKERS.find((s) => s.part === p) || {}).name || (p ? "Part " + p : "");
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
document.title = (DATA.title || "Deck") + " · remote";
$("pickTitle").textContent = DATA.title || "Remote";

// every step of the deck in order, to count how far away your turn is
let FLAT = [];
function flatten() { FLAT = []; SCENES.forEach((s, si) => (s.chunks.length ? s.chunks : [""]).forEach((_, ci) => FLAT.push({ si, ci, part: s.part }))); }
flatten();

function buildPicker() {
  const list = $("pickList");
  list.textContent = "";
  for (const s of SPEAKERS) {
    const b = document.createElement("button");
    b.dataset.part = s.part;
    b.append(s.name);
    const tag = document.createElement("span"); tag.textContent = "part " + s.part; b.append(tag);
    list.append(b);
  }
  document.querySelectorAll("#pick button").forEach((b) => b.onclick = () => choose(Number(b.dataset.part)));
}
buildPicker();

const fromHash = () => location.hash === "#watch" ? 0 : Number((/^#part(\d+)$/.exec(location.hash) || [])[1] || NaN);
let me = fromHash();
if (Number.isNaN(me)) me = store.get("remoteMe:" + key, null);
let state = null, deckOnline = false, sock = null, wasMine = false;
let sizeAt = store.get("remoteSizeAt", 1);
document.documentElement.style.setProperty("--size", SIZES[sizeAt] + "px");

function choose(p) {
  me = p; store.set("remoteMe:" + key, p);
  history.replaceState(null, "", location.search + (p ? "#part" + p : "#watch"));
  wasMine = isMine(); wake(); render(); report();
}
$("who").onclick = () => { if (recording()) return; me = null; render(); };
$("aa").onclick = () => {
  sizeAt = (sizeAt + 1) % SIZES.length; store.set("remoteSizeAt", sizeAt);
  document.documentElement.style.setProperty("--size", SIZES[sizeAt] + "px");
};
window.addEventListener("hashchange", () => { const h = fromHash(); if (!Number.isNaN(h)) choose(h); });

const live = () => !!(sock && sock.readyState === 1 && deckOnline);
// without scene notes on the server every speaker may move the deck (plain clicker)
function isMine() {
  if (!me || !state) return false;
  if (!SCENES.length) return true;
  const s = SCENES[state.index];
  return !!s && s.part === me;
}

function para(text, cls) { const p = document.createElement("p"); p.textContent = text; if (cls) p.className = cls; return p; }

function render() {
  const picking = me === null || me === undefined;
  $("pick").hidden = !picking; $("main").hidden = picking;
  if (picking) return;

  $("mic").hidden = !me;
  $("who").textContent = "";
  const b = document.createElement("b"); b.textContent = me ? nameOf(me) : "Watching"; $("who").append(b);
  const open = sock && sock.readyState === 1;
  $("conn").className = "conn" + (live() ? "" : " off");
  $("connText").textContent = !open ? "reconnecting" : deckOnline ? "live" : "deck offline";
  renderSetup(); renderRec();

  const st = $("status"), read = $("read");
  read.textContent = "";
  $("replay").hidden = true;
  if (!state) {
    st.className = "status"; st.textContent = open ? "Waiting for the deck…" : "Connecting…";
    $("where").textContent = ""; $("dots").textContent = ""; $("hint").textContent = ""; $("media").hidden = true;
    setBar(false, ""); return;
  }
  const s = SCENES[state.index];
  const mine = isMine();
  const step = state.step || 0;

  if (!s) {
    // plain clicker: no notes, only the counter
    st.className = "status" + (mine ? " mine" : ""); st.textContent = me ? "You can move the deck" : "Watching";
    $("where").textContent = `Scene ${state.index + 1}`;
    $("dots").innerHTML = Array.from({ length: (state.steps ?? 0) + 1 }, (_, k) => `<i class="${k <= step ? "on" : ""}"></i>`).join("");
    $("hint").textContent = "";
    renderMedia(mine);
    setBar(mine, "");
    return;
  }

  const ci = Math.min(step, Math.max(0, s.chunks.length - 1));
  const here = FLAT.findIndex((f) => f.si === state.index && f.ci === ci);
  const mineAt = FLAT.findIndex((f, k) => k > here && f.part === me);
  const away = mineAt > 0 ? mineAt - here : -1;
  st.className = "status" + (mine ? " mine" : away === 1 ? " soon" : "");
  st.textContent = mine ? "Your turn" : s.appendix ? "Backup slide: the lead answers a question" : `${nameOf(s.part) || "Nobody"} is speaking`;
  if (!mine && me) {
    const small = document.createElement("small");
    small.textContent = away === 1 ? "You are next: get ready" : away > 0 ? `Your turn in ${away} steps` : "Your part is done";
    st.append(small);
  }

  const main = SCENES.filter((x) => !x.appendix).length;
  $("where").textContent = s.appendix ? `Backup · ${s.title}` : `${state.index + 1}/${main} · ${s.title}`;
  $("dots").innerHTML = s.chunks.map((_, k) => `<i class="${k <= ci ? "on" : ""}"></i>`).join("");

  // the text of this step; yours is highlighted, the others' is quiet
  const text = s.chunks[ci];
  if (text) read.append(para(text, mine ? "mine" : me === 0 ? "" : "quiet"));
  else if (mine) read.append(para("Nothing to say here. Press Next when the animation stops.", "empty"));
  if (mine) {
    const after = s.chunks[ci + 1];
    if (after) read.append(para(after, "after"));
  } else if (me && mineAt > 0) {
    // a preview of your first line, so you can get ready
    const f = FLAT[mineAt], first = SCENES[f.si].chunks[f.ci];
    if (first) read.append(para(first, "after"));
  }
  read.scrollTop = 0;

  // one line about what Next does, only when it is more than the next sentence
  let hint = "";
  if (mine) {
    const last = ci >= s.chunks.length - 1, nxt = SCENES[state.index + 1];
    if (last && !nxt) hint = "Last step. Finish the sentence.";
    else if (last && nxt.part !== s.part) hint = `Next hands over to ${nameOf(nxt.part)}.`;
    else if (last) hint = `Next opens: ${nxt.title}.`;
  }
  $("hint").textContent = hint;
  renderMedia(mine);
  // the intro can be replayed while the first scene is on screen
  $("replay").hidden = !(me && state.index === 0);
  $("replay").disabled = !live();
  setBar(mine, mine ? "" : `${nameOf(s.part) || "Nobody"}'s turn`);
}

function setBar(mine, sub) {
  $("bar").hidden = !me;
  $("bar").className = "bar" + (mine ? " mine" : "");
  $("fwd").textContent = "Next";
  if (sub) { const sm = document.createElement("small"); sm.textContent = sub; $("fwd").append(sm); }
  // while a video plays, Next and Back wait for its end (the server drops them too)
  const videoOn = !!(state && state.media && !state.media.ended);
  $("fwd").disabled = $("back").disabled = !(mine && live()) || videoOn;
}

function renderMedia(mine) {
  const md = state && state.media;
  $("media").hidden = !md;
  if (!md) return;
  const c = (x) => `${Math.floor((x || 0) / 60)}:${String(Math.floor((x || 0) % 60)).padStart(2, "0")}`;
  $("mChapter").textContent = md.ended ? "Video ended" : `${md.playing ? "Playing" : "Paused"}${md.chapter ? " · " + md.chapter : ""}`;
  $("mTime").textContent = `${c(md.t)} / ${c(md.dur)}`;
  $("mBar").style.width = `${md.dur ? Math.min(100, (md.t / md.dur) * 100) : 0}%`;
  // the video is run from the lead laptop only: the phones show where it is, without pause or skip
  if (mine && !md.ended) $("hint").textContent = "The video is playing. Stay quiet: Next comes back when it ends.";
}

// your turn: buzz and flash once when the deck reaches your part
function checkTurn() {
  const mine = isMine();
  if (mine && !wasMine && state) {
    buzz([180, 90, 180]);
    const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  }
  wasMine = mine;
}

/* ------------------------------------------------------------------ microphone */

// One microphone stream for both jobs: the level for the deck's speaker chip (~10 per second,
// numbers only) and the local recording. Processing is off by default for the cleanest voice,
// which is why headphones are required: the phone must not hear the call.
let mic = null, micPerm = "unknown", levelOn = false;
const hp = $("hp"), meet = $("meet");
hp.checked = store.get("remoteHeadphones", false);
meet.checked = store.get("remoteMeetOnLaptop", false);
hp.onchange = () => { store.set("remoteHeadphones", hp.checked); renderSetup(); report(); };
meet.onchange = () => { store.set("remoteMeetOnLaptop", meet.checked); renderSetup(); report(); };

if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: "microphone" }).then((p) => {
    micPerm = p.state; p.onchange = () => { micPerm = p.state; render(); report(); }; render(); report();
  }).catch(() => {});
}

const micLive = () => !!(mic && mic.stream.getAudioTracks().some((t) => t.readyState === "live"));
async function openMic() {
  if (micLive()) { if (mic.ctx.state === "suspended") mic.ctx.resume().catch(() => {}); return mic; }
  if (mic) closeMic();
  const processing = !!RECCFG.processing;
  const stream = await navigator.mediaDevices.getUserMedia({ audio: {
    channelCount: 1, sampleRate: 48000, echoCancellation: processing, noiseSuppression: processing, autoGainControl: processing } });
  micPerm = "granted";
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume().catch(() => {});
  const an = ctx.createAnalyser(); an.fftSize = 1024;
  ctx.createMediaStreamSource(stream).connect(an);
  const buf = new Float32Array(an.fftSize);
  let smooth = 0;
  const timer = setInterval(() => {
    an.getFloatTimeDomainData(buf);
    let sum = 0; for (const x of buf) sum += x * x;
    const v = Math.min(1, Math.sqrt(sum / buf.length) * 7);
    smooth = v > smooth ? v : smooth * 0.82 + v * 0.18;
    $("micLv").style.width = Math.round(smooth * 100) + "%";
    if ((levelOn || recording()) && sock && sock.readyState === 1 && me) sock.send(JSON.stringify({ type: "level", part: me, v: Math.round(smooth * 100) / 100 }));
  }, 100);
  stream.getAudioTracks().forEach((t) => t.addEventListener("ended", () => { render(); report(); }));
  mic = { stream, ctx, timer };
  return mic;
}
function closeMic() {
  if (!mic) return;
  clearInterval(mic.timer); mic.stream.getTracks().forEach((t) => t.stop()); mic.ctx.close().catch(() => {});
  mic = null; $("micLv").style.width = "0";
}
async function toggleMic() {
  if (levelOn) { levelOn = false; if (!recording()) closeMic(); }
  else {
    try { await openMic(); levelOn = true; $("micText").textContent = "Mic"; }
    catch (e) { if (e && e.name === "NotAllowedError") micPerm = "denied"; $("micText").textContent = "Mic blocked"; }
  }
  $("mic").classList.toggle("on", levelOn); $("mic").setAttribute("aria-pressed", String(levelOn));
  render(); report();
}
$("mic").onclick = toggleMic;
$("micTest").onclick = async (e) => { e.preventDefault(); if (!levelOn) await toggleMic(); };

function setupDone() { return micPerm === "granted" && hp.checked && meet.checked; }
function renderSetup() {
  const show = !!me && !recording();
  $("setup").hidden = !show;
  if (!show) return;
  const ok = micPerm === "granted";
  $("micState").textContent = ok ? (levelOn ? "Microphone: on" : "Microphone: allowed") : micPerm === "denied" ? "Microphone: blocked in the browser settings" : "Microphone: not allowed yet";
  $("micState").className = ok ? "ok" : "warn";
  $("micTest").hidden = levelOn;
  $("micTest").textContent = ok ? "Turn on" : "Allow";
  $("setupSum").textContent = setupDone() ? "Ready to record ✓" : "Before the recording (3 checks)";
  if (!setupDone() && !$("setup").dataset.opened) { $("setup").open = true; $("setup").dataset.opened = "1"; }
}

/* ------------------------------------------------------------------ local recording (double-ender) */

// The lead starts and stops the recording for everyone. Each phone records its own microphone with
// MediaRecorder and uploads a chunk every few seconds, so a dead phone loses at most one chunk.
let recSession = null, recState = "idle", recorder = null, take = null, hiddenAt = 0;
const recording = () => recState === "countdown" || recState === "recording";
const CHUNK_MS = Number(RECCFG.chunkMs || 5000);
function pickMime() {
  const list = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4;codecs=mp4a.40.2", "audio/mp4", "audio/ogg;codecs=opus"];
  if (!window.MediaRecorder) return null;
  return list.find((m) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
}
const extOf = (mime) => /mp4/.test(mime) ? "mp4" : /ogg/.test(mime) ? "ogg" : "webm";
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => b.toString(16).padStart(2, "0")).join("");

async function startTake() {
  if (!me || !recSession || !recording()) return;
  if (recorder && recorder.state === "recording") return;
  try { await openMic(); }
  catch {
    showAlert("Tap to join the recording", "The browser needs one tap to use the microphone.", "Start my microphone", startTake);
    return;
  }
  const mime = pickMime();
  if (mime === null) { showAlert("This browser cannot record", "Use Chrome on Android or Safari 14.5+ on iPhone. The deck still works.", "OK"); return; }
  const opts = { audioBitsPerSecond: Number(RECCFG.bitrate || 128000) };
  if (mime) opts.mimeType = mime;
  let r;
  try { r = new MediaRecorder(mic.stream, opts); } catch { r = new MediaRecorder(mic.stream); }
  const t = { id: rid(), session: recSession, seq: 0, queue: [], bytes: 0, lastOk: 0, t0: null, mime: r.mimeType || mime || "", busy: false };
  take = t; recorder = r;
  r.ondataavailable = (e) => { if (e.data && e.data.size) { t.queue.push({ seq: t.seq++, blob: e.data }); pump(t); } };
  r.onstop = () => { pump(t); render(); };
  r.onerror = () => render();
  r.start(CHUNK_MS);
  t.t0 = Date.now();      // when the recorder started, phone clock; the server adds the clock offset
  report(); render();
}

function stopTake() {
  if (recorder && recorder.state !== "inactive") { try { recorder.stop(); } catch {} }
  recorder = null;
  if (!levelOn) setTimeout(() => { if (!recording()) closeMic(); }, 1500);
}

// uploads in order and retries with backoff; the server answers 409 with the chunk it expects
async function pump(t) {
  if (t.busy) return;
  t.busy = true;
  let wait = 500;
  while (t.queue.length) {
    const c = t.queue[0];
    const q = new URLSearchParams({ k: key, session: t.session, part: me, take: t.id, seq: c.seq, ext: extOf(t.mime), mime: t.mime,
      t0: t.t0 ?? Date.now(), off: Math.round(clock.offset ?? 0), rtt: Math.round(clock.rtt ?? -1) });
    try {
      const res = await fetch("/upload?" + q, { method: "POST", body: c.blob, headers: { "content-type": "application/octet-stream" } });
      const body = await res.json().catch(() => ({}));
      if (res.ok) { t.queue.shift(); t.bytes = body.bytes ?? t.bytes + c.blob.size; t.lastOk = Date.now(); wait = 500; renderRec(); continue; }
      if (res.status === 409 && typeof body.next === "number") {
        while (t.queue.length && t.queue[0].seq < body.next) t.queue.shift();
        if (t.queue.length && t.queue[0].seq > body.next) break;   // the server lost a chunk we no longer have
        continue;
      }
      if (res.status === 410 || res.status === 400 || res.status === 403) { t.queue = []; break; }
    } catch { /* offline: try again */ }
    await new Promise((ok) => setTimeout(ok, wait));
    wait = Math.min(5000, wait * 2);
  }
  t.busy = false;
  renderRec();
}

function onRec(m) {
  const prev = recState;
  recState = m.state; recSession = m.session || recSession;
  if (m.state === "countdown" && prev !== "countdown") {
    buzz(60);
    if (me) startTake();      // start now, so the beep is inside the recording
    countdown(m.countdownMs || 3000);
  } else if (m.state === "recording") {
    $("count").hidden = true;
    if (me && (!recorder || recorder.state !== "recording")) startTake();
  } else if (m.state === "stopped" || m.state === "idle") {
    $("count").hidden = true;
    if (prev === "recording" || prev === "countdown") buzz([60, 60, 60]);
    stopTake();
  }
  render(); report();
}

let countTimer = null;
function countdown(ms) {
  clearInterval(countTimer);
  const end = Date.now() + ms;
  $("count").hidden = false;
  const tick = () => {
    const left = Math.ceil((end - Date.now()) / 1000);
    $("countN").textContent = Math.max(1, left);
    if (left <= 0) { clearInterval(countTimer); $("count").hidden = true; }
  };
  tick(); countTimer = setInterval(tick, 100);
}

function renderRec() {
  const on = recording() && !!me;
  $("recbar").hidden = !on;
  if (!on) return;
  const t = take;
  const s = t && t.t0 ? Math.floor((Date.now() - t.t0) / 1000) : 0;
  const ok = recorder && recorder.state === "recording";
  $("recText").textContent = ok ? `REC ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "REC: microphone not running";
  const age = t && t.lastOk ? Math.round((Date.now() - t.lastOk) / 1000) : null;
  $("recUp").textContent = !t ? "" : t.queue.length > 1 ? `${t.queue.length} waiting` : age === null ? "uploading…" : `saved ${age}s ago`;
}
setInterval(() => { if (recording()) renderRec(); }, 1000);

// Mobile browsers pause the page (and often the recorder) in the background or with the screen locked.
// Leaving is logged as a gap in timeline.json; on return the recording resumes as a new take.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    hiddenAt = Date.now();
    if (recording() && me) gap("hidden", false);
    report();
    return;
  }
  lock = null; wake();
  if (!sock || sock.readyState > 1) { retry = 0; connect(); }
  else if (sock.readyState === 1) send("hello");
  if (recording() && me && hiddenAt) {
    const away = Date.now() - hiddenAt;
    const alive = recorder && recorder.state === "recording" && micLive();
    (async () => {
      if (!alive) { stopTake(); await startTake(); }
      gap("visible", !alive, away);
    })();
    hiddenAt = 0;
    buzz([200, 100, 200]);
    showAlert("You left the remote during the recording",
      `For ${Math.round(away / 1000)} s your phone may not have recorded. It is recording again now. Keep this page open and the screen on until the lead stops.`, "Got it");
  }
  hiddenAt = 0;
  report();
});
function gap(st, resumed, hiddenMs) {
  if (sock && sock.readyState === 1) sock.send(JSON.stringify({ type: "rec-gap", part: me, state: st, at: Date.now(), offset: Math.round(clock.offset ?? 0), resumed, hiddenMs }));
}

function showAlert(h, p, btn, action) {
  $("alertH").textContent = h; $("alertP").textContent = p; $("alertBtn").textContent = btn || "OK";
  $("alert").hidden = false;
  $("alertBtn").onclick = () => { $("alert").hidden = true; wake(); if (action) action(); };
}

/* ------------------------------------------------------------------ phone health for the pre-flight page */

let battery = null;
if (navigator.getBattery) navigator.getBattery().then((b) => { battery = b; b.onlevelchange = b.onchargingchange = report; report(); }).catch(() => {});
function report() {
  if (!sock || sock.readyState !== 1 || me === null || me === undefined) return;
  sock.send(JSON.stringify({ type: "status", part: me,
    battery: battery ? Math.round(battery.level * 100) : null, charging: battery ? battery.charging : null,
    mic: micPerm, micOn: micLive(), headphones: hp.checked && meet.checked,
    recording: !!(recorder && recorder.state === "recording"), hidden: document.visibilityState === "hidden",
    queue: take ? take.queue.length : 0, rtt: clock.rtt, offset: clock.offset, mime: take ? take.mime : pickMime() }));
}
setInterval(report, 3000);

/* ------------------------------------------------------------------ deck commands */

function send(cmd) {
  if (sock && sock.readyState === 1) sock.send(JSON.stringify({ type: "cmd", cmd, part: me }));
  if (cmd !== "hello") buzz(12);
  wake();
}
function press(cmd) {
  send(cmd);
  const f = $("fwd"); f.classList.add("sent"); setTimeout(() => f.classList.remove("sent"), 180);
}
$("fwd").onclick = () => press("next");
$("back").onclick = () => press("prev");
$("replay").onclick = () => send("replay");
// a Bluetooth clicker or keyboard paired with the phone
document.addEventListener("keydown", (e) => {
  if ($("fwd").disabled || e.target.tagName === "INPUT") return;
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); press("next"); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); press("prev"); }
});
// no double-tap zoom on the buttons (iOS ignores user-scalable)
let lastTouch = 0;
document.addEventListener("touchend", (e) => { const now = Date.now(); if (now - lastTouch < 350 && e.target.closest("button")) e.preventDefault(); lastTouch = now; }, { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());

/* ------------------------------------------------------------------ connection and clock */

// clock offset to the server, NTP-style: offset = server - (sent + rtt/2); the sample with the smallest rtt wins
const clock = { offset: null, rtt: null, samples: [] };
function onPong(m) {
  const now = Date.now(), rtt = now - m.t;
  if (typeof m.server !== "number" || rtt < 0) return;
  clock.samples.push({ rtt, offset: m.server - (m.t + rtt / 2) });
  if (clock.samples.length > 16) clock.samples.shift();
  const best = clock.samples.reduce((a, b) => (b.rtt < a.rtt ? b : a));
  clock.rtt = Math.round(best.rtt); clock.offset = Math.round(best.offset);
}
const ping = () => { if (sock && sock.readyState === 1) sock.send(JSON.stringify({ type: "ping", t: Date.now() })); };

let retry = 0, retryTimer = null, lastMsg = 0;
function connect() {
  clearTimeout(retryTimer);
  if (sock && (sock.readyState === 0 || sock.readyState === 1)) return;
  const s = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?role=remote&k=${encodeURIComponent(key)}`);
  sock = s;
  s.onopen = () => {
    retry = 0; lastMsg = Date.now(); send("hello"); report(); render();
    for (let i = 0; i < 6; i++) setTimeout(ping, i * 250);   // a burst for a good first clock estimate
  };
  s.onmessage = (e) => {
    lastMsg = Date.now();
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === "pong") { onPong(m); return; }
    if (m.type === "state") { state = m.state; checkTurn(); }
    else if (m.type === "deck") deckOnline = m.online;
    else if (m.type === "scenes") { SCENES = m.scenes || []; if (m.speakers) SPEAKERS = m.speakers; flatten(); buildPicker(); wasMine = isMine(); }
    else if (m.type === "rec") onRec(m);
    render();
  };
  s.onclose = () => {
    if (sock !== s) return;
    render();
    retryTimer = setTimeout(connect, Math.min(5000, 600 * 2 ** retry++));
  };
}
setInterval(() => {
  if (!sock || sock.readyState !== 1) return;
  if (Date.now() - lastMsg > 25000) { sock.close(); return; }
  ping();
}, 10000);
window.addEventListener("online", connect);

// keep the phone screen on while the remote is open
let lock = null;
async function wake() { try { if (!lock && navigator.wakeLock && document.visibilityState === "visible") { lock = await navigator.wakeLock.request("screen"); lock.onrelease = () => { lock = null; }; } } catch {} }
document.addEventListener("click", wake);

render();
connect();
wake();
</script>
</body>
</html>
