<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0E121B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Remote</title>
<style>
/* Phone first, one hand, portrait: a slim status bar at the top, the text in the middle,
   the big Next under the thumb. Two screens: Join (one tap) and Talk. Everything else is in "…". */
:root {
  --bg: #0E121B; --surface: #171D2A; --raise: #1F2737; --ink: #EEF1F7; --muted: #8E97AB; --faint: #5A6479; --line: #262E40;
  --turn: #FF8A4C; --turn-ink: #1C0D04; --turn-soft: rgba(255,138,76,.12); --good: #4CC38A; --warn: #F2B544; --bad: #FF6B5E; --rec: #FF4D4D;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --size: 26px; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; }
button:focus-visible { outline: 3px solid var(--turn); outline-offset: 2px; }
.screen { height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
.small { font-size: 15px; color: var(--muted); }
.link { color: var(--muted); font-size: 15px; padding: 12px 6px; text-decoration: underline; text-underline-offset: 3px; }

/* who are you (only when the link has no #partN) */
.pick { justify-content: flex-end; gap: 10px; }
.pick h1 { font-size: 28px; margin: 0 0 4px; }
.pick button { text-align: left; font-size: 21px; font-weight: 650; padding: 0 20px; border-radius: 18px; min-height: 64px;
  background: var(--surface); display: flex; justify-content: space-between; align-items: center; }
.pick button span { color: var(--faint); font: 500 14px var(--mono); }
.pick .watch { background: transparent; border: 1px dashed var(--line); color: var(--muted); }

/* Join: one tap */
.join { justify-content: space-between; }
.join .title { font: 600 13px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding-top: 8px; }
.join .hello { display: flex; flex-direction: column; gap: 14px; }
.join h1 { margin: 0; font-size: 40px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; }
.join p { margin: 0; font-size: 20px; line-height: 1.45; color: var(--muted); }
.join .err { color: var(--bad); font-size: 17px; line-height: 1.4; }
.join .foot { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.join .foot .row { display: flex; justify-content: space-between; }
.go { min-height: 96px; border-radius: 26px; background: var(--turn); color: var(--turn-ink); font-size: 28px; font-weight: 800; }
.go:disabled { opacity: .55; }

/* Talk */
.talk { gap: 10px; }
.top { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); flex: none; }
.dot.off { background: var(--bad); animation: blink 1s infinite; }
.dot.wait { background: var(--warn); }
@keyframes blink { 50% { opacity: .25; } }
.me { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.lv { width: 28px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.lv i { display: block; height: 100%; width: 0; background: var(--good); transition: width .1s; }
.spacer { flex: 1; }
.pill { border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 800; letter-spacing: .04em; white-space: nowrap; flex: none; }
.pill.turn { background: var(--turn); color: var(--turn-ink); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,138,76,.55); } 50% { box-shadow: 0 0 0 7px rgba(255,138,76,0); } }
.pill.rec { background: var(--rec); color: #fff; font-family: var(--mono); }
/* team strip: your mic button (as in Meet) and a chip per teammate */
.team { display: flex; align-items: center; gap: 10px; flex: none; }
.mic, .cam { --lv: 0; width: 60px; height: 60px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--raise); color: var(--ink); box-shadow: 0 0 0 calc(var(--lv) * 9px) rgba(76,195,138,.45); transition: background .15s, box-shadow .1s; }
.mic svg { width: 28px; height: 28px; }
.mic.off { background: #EA4335; color: #fff; box-shadow: none; }
.mic.none { background: var(--surface); color: var(--faint); box-shadow: none; }
.cam { position: relative; overflow: hidden; box-shadow: none; }
.cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); border-radius: 50%; }
.cam svg { position: relative; }
.cam.on svg { opacity: 0; }
.cam.off { background: #EA4335; color: #fff; }
.cam.none { background: var(--surface); color: var(--faint); }
.mates { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; }
.mate { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mate .face { position: relative; width: 44px; height: 44px; border-radius: 50%; background: var(--raise); display: grid; place-items: center;
  font-size: 15px; font-weight: 800; color: var(--muted); border: 2px solid transparent; transition: border-color .15s, box-shadow .15s; }
.mate .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.mate .badge { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); }
.mate svg { width: 13px; height: 13px; }
.mate b { font-size: 12px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.mate.live svg { color: var(--good); }
.mate.muted svg { color: #FF6B5E; }
.mate.nomic svg, .mate.gone svg { color: var(--faint); }
.mate.gone { opacity: .45; }
.mate.gone .face { border-style: dashed; border-color: var(--line); }
.mate.turn .face { border-color: var(--turn); }
.mate.turn b { color: var(--turn); }
.mate.talking .face { box-shadow: 0 0 0 3px rgba(76,195,138,.75); }
.mute-note { font-size: 13px; color: var(--faint); text-align: center; margin-top: -4px; flex: none; }
.mute-note.on { color: #FF8A80; }
.pill.rec.bad { background: transparent; color: var(--rec); border: 1px solid var(--rec); }
.micwarn { min-height: 52px; border-radius: 14px; background: var(--bad); color: #fff; font-size: 16px; font-weight: 750; }
.more { width: 44px; height: 44px; border-radius: 12px; font-size: 22px; font-weight: 800; color: var(--muted); flex: none; line-height: 1; }
.where { display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 600 12px var(--mono);
  letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.where span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps { display: flex; gap: 5px; flex: none; }
.steps i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.steps i.on { background: var(--muted); }
.who { font-size: 17px; font-weight: 650; color: var(--muted); min-height: 24px; }
.who.mine { color: var(--turn); font-size: 22px; font-weight: 800; }
.who small { font-weight: 500; color: var(--faint); }
.who.soon small { color: var(--turn); font-weight: 700; }
.read { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-user-select: text; user-select: text; padding: 4px 0; }
.read p { margin: 0 0 16px; line-height: 1.42; }
.read p.mine { font-size: var(--size); font-weight: 600; color: var(--ink); border-left: 4px solid var(--turn); padding-left: 14px; }
.read p.other { font-size: calc(var(--size) * .74); color: var(--faint); font-weight: 500; }
.read p.watch { font-size: calc(var(--size) * .85); color: var(--ink); }
.read p.after { font-size: calc(var(--size) * .68); color: var(--muted); }
.read p.after b { color: var(--faint); font-weight: 700; }
.read p.empty { font-size: 20px; color: var(--turn); font-weight: 700; }
.hint { font-size: 15px; font-weight: 650; color: var(--turn); min-height: 0; }
.media { border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; background: var(--surface); }
.media .line { display: flex; justify-content: space-between; gap: 8px; font: 600 14px var(--mono); color: var(--muted); }
.media .line b { color: var(--ink); font-family: var(--font); font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.media .track { height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
.media .track i { display: block; height: 100%; background: var(--turn); width: 0; }
.bar { display: flex; gap: 10px; flex: none; }
.back { flex: 0 0 24%; background: var(--surface); border-radius: 24px; font-size: 18px; font-weight: 700; color: var(--muted); min-height: 128px; }
.next { flex: 1 1 auto; border-radius: 24px; min-height: 128px; font-size: 30px; font-weight: 800; background: var(--surface); color: var(--faint); transition: transform .08s, background .2s; }
.next small { display: block; font-size: 14px; font-weight: 600; margin-top: 4px; }
.bar.mine .next { background: var(--turn); color: var(--turn-ink); }
.bar.mine .back { color: var(--ink); }
.next:disabled, .back:disabled { opacity: .5; }
.bar.mine .next:disabled { opacity: .45; }
.next.sent { transform: scale(.97); }
.flash { position: fixed; inset: 0; pointer-events: none; background: var(--turn); opacity: 0; z-index: 5; }
.flash.go { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { opacity: .5; } 100% { opacity: 0; } }

/* the "…" sheet: everything that is not needed to talk */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet .card { width: 100%; max-width: 560px; background: var(--surface); border-radius: 24px 24px 0 0; padding: 18px 20px max(18px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 4px; }
.sheet .rowi { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 46px; font-size: 16px; border-bottom: 1px solid var(--line); }
.sheet .rowi span:first-child { color: var(--muted); }
.sheet .rowi span:last-child { font-weight: 650; text-align: right; }
.sheet .acts { display: flex; gap: 10px; margin-top: 12px; }
.sheet .acts button { flex: 1; min-height: 54px; border-radius: 16px; background: var(--raise); font-size: 16px; font-weight: 700; }
.sheet .acts button:disabled { opacity: .4; }
.sheet .close { margin-top: 10px; min-height: 54px; border-radius: 16px; background: var(--ink); color: var(--bg); font-size: 17px; font-weight: 800; }

/* full-screen covers: the countdown and the "you left the page" warning */
.cover { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 28px; text-align: center; }
.cover.count { background: #000; color: #fff; }
.cover.count b { font-size: 180px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.cover.count span { font-size: 20px; color: #bbb; }
.cover.alert { background: var(--rec); color: #fff; }
.cover.alert h2 { margin: 0; font-size: 30px; line-height: 1.15; }
.cover.alert p { margin: 0; font-size: 19px; line-height: 1.45; max-width: 26em; }
.cover button { min-height: 72px; min-width: 80%; border-radius: 22px; font-size: 22px; font-weight: 800; background: #fff; color: #111; }
@media (prefers-reduced-motion: reduce) { .next.sent { transform: none; } .flash.go { animation-duration: .01s; } .dot.off, .pill.turn { animation: none; } }
@media (max-height: 640px) { .back, .next { min-height: 88px; } .go { min-height: 76px; } }
</style>
</head>
<body>

<div class="screen pick" id="pick" hidden>
  <h1 id="pickTitle">Remote</h1>
  <p class="small" style="margin:0 0 8px">Who are you?</p>
  <div id="pickList" style="display:flex;flex-direction:column;gap:10px"></div>
  <button data-part="0" class="watch" id="pickWatch">Just watch</button>
</div>

<div class="screen join" id="join" hidden>
  <div class="title" id="joinTitle"></div>
  <div class="hello">
    <h1 id="joinHi">Hi</h1>
    <p>Laptop on the call, headphones on, keep this page open.</p>
    <div class="err" id="joinErr" hidden></div>
  </div>
  <div class="foot">
    <button class="go" id="ready">I'm ready</button>
    <div class="row"><button class="link" id="joinWho">Not you?</button><button class="link" id="noMic" hidden>Continue without microphone</button></div>
  </div>
</div>

<div class="screen talk" id="talk" hidden>
  <div class="top">
    <i class="dot off" id="dot" role="status" aria-label="connecting"></i>
    <span class="me" id="meName"></span>
    <span class="lv" id="lvBox" hidden><i id="lv"></i></span>
    <span class="spacer"></span>
    <span class="pill turn" id="turnPill" hidden>YOUR TURN</span>
    <span class="pill rec" id="recPill" hidden>● REC</span>
    <button class="more" id="more" aria-label="Details">…</button>
  </div>
  <button class="micwarn" id="micWarn" hidden>Microphone stopped. Tap to turn it on</button>
  <div class="where"><span id="where"></span><span class="steps" id="steps"></span></div>
  <div class="who" id="who" aria-live="polite"></div>
  <div class="read" id="read"></div>
  <div class="hint" id="hint"></div>
  <div class="media" id="media" hidden>
    <div class="line"><b id="mChapter"></b><span id="mTime"></span></div>
    <div class="track"><i id="mBar"></i></div>
  </div>
  <div class="team" id="team" hidden><button class="mic" id="micBtn" aria-label="Microphone"></button><button class="cam" id="camBtn" aria-label="Camera" hidden><video id="selfView" muted playsinline autoplay></video></button><div class="mates" id="mates"></div></div>
  <div class="mute-note" id="muteNote" hidden></div>
  <div class="bar" id="bar">
    <button class="back" id="back" aria-label="Back one step">Back</button>
    <button class="next" id="fwd">Next</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-label="Details">
    <div class="rowi"><span>Microphone</span><span id="dMic"></span></div>
    <div class="rowi"><span>Connection</span><span id="dConn"></span></div>
    <div class="rowi"><span>Recording</span><span id="dRec"></span></div>
    <div class="rowi"><span>Battery</span><span id="dBat"></span></div>
    <div class="acts"><button id="aa">Text size</button><button id="change">Change speaker</button></div>
    <button class="close" id="sheetClose">Close</button>
  </div>
</div>

<div class="flash" id="flash"></div>
<div class="cover count" id="count" hidden><span>Recording starts</span><b id="countN">3</b><span>Stay quiet for the beep</span></div>
<div class="cover alert" id="alert" hidden><h2 id="alertH"></h2><p id="alertP"></p><button id="alertBtn">OK</button></div>

<script>
// Filled by server.mjs: { title, speakers: [{ part, name }], scenes: [{ id, title, speaker, part, chunks }], recording: {...} }
const DATA = __DATA__;
let SCENES = DATA.scenes || [];
let SPEAKERS = DATA.speakers || [];
const RECCFG = DATA.recording || {};
const SIZES = [22, 26, 32];
const key = new URLSearchParams(location.search).get("k") || "";
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const nameOf = (p) => (SPEAKERS.find((s) => s.part === p) || {}).name || (p ? "Part " + p : "");
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
document.title = (DATA.title || "Deck") + " · remote";
$("pickTitle").textContent = DATA.title || "Remote";
$("joinTitle").textContent = DATA.title || "";

// every step of the deck in order, to count how far away your turn is
let FLAT = [];
function flatten() { FLAT = []; SCENES.forEach((s, si) => (s.chunks.length ? s.chunks : [""]).forEach((_, ci) => FLAT.push({ si, ci, part: s.part }))); }
flatten();

function buildPicker() {
  const list = $("pickList");
  list.textContent = "";
  for (const s of SPEAKERS) {
    const b = document.createElement("button");
    b.dataset.part = s.part;
    b.append(s.name);
    const tag = document.createElement("span"); tag.textContent = "part " + s.part; b.append(tag);
    list.append(b);
  }
  document.querySelectorAll("#pick button").forEach((b) => b.onclick = () => choose(Number(b.dataset.part)));
}
buildPicker();

const fromHash = () => location.hash === "#watch" ? 0 : Number((/^#part(\d+)$/.exec(location.hash) || [])[1] || NaN);
let me = fromHash();
if (Number.isNaN(me)) me = store.get("remoteMe:" + key, null);
let state = null, deckOnline = false, sock = null, wasMine = false;
// joined = the speaker tapped "I'm ready" on this page load (mic on, headphones and call on the laptop confirmed)
let joined = false;
let sizeAt = store.get("remoteSizeAt", 1);
document.documentElement.style.setProperty("--size", SIZES[sizeAt] + "px");

function choose(p) {
  me = p; store.set("remoteMe:" + key, p);
  history.replaceState(null, "", location.search + (p ? "#part" + p : "#watch"));
  joined = false; wasMine = isMine(); wake(); render(); report();
}
function changeSpeaker() { if (recording()) return; closeSheet(); me = null; joined = false; render(); }
$("joinWho").onclick = changeSpeaker;
$("change").onclick = changeSpeaker;
$("aa").onclick = () => {
  sizeAt = (sizeAt + 1) % SIZES.length; store.set("remoteSizeAt", sizeAt);
  document.documentElement.style.setProperty("--size", SIZES[sizeAt] + "px");
};
window.addEventListener("hashchange", () => { const h = fromHash(); if (!Number.isNaN(h)) choose(h); });

const live = () => !!(sock && sock.readyState === 1 && deckOnline);
// without scene notes on the server every speaker may move the deck (plain clicker)
function isMine() {
  if (!me || !state) return false;
  if (!SCENES.length) return true;
  const s = SCENES[state.index];
  return !!s && s.part === me;
}

function para(text, cls, lead) {
  const p = document.createElement("p");
  if (lead) { const b = document.createElement("b"); b.textContent = lead + " "; p.append(b); }
  p.append(text); if (cls) p.className = cls; return p;
}

/* ------------------------------------------------------------------ screens */

function render() {
  const picking = me === null || me === undefined;
  const joining = !picking && me > 0 && !joined;
  $("pick").hidden = !picking; $("join").hidden = !joining; $("talk").hidden = picking || joining;
  if (picking) return;
  if (joining) { renderJoin(); return; }
  renderTop(); renderRec();
  if (!$("sheet").hidden) renderSheet();

  const who = $("who"), read = $("read");
  read.textContent = "";
  const open = sock && sock.readyState === 1;
  if (!state) {
    who.className = "who"; who.textContent = open ? "Waiting for the deck…" : "Connecting…";
    $("where").textContent = ""; $("steps").textContent = ""; $("hint").textContent = ""; $("media").hidden = true;
    setBar(false, ""); return;
  }
  const s = SCENES[state.index];
  const mine = isMine();
  const step = state.step || 0;

  if (!s) {
    // plain clicker: no notes, only the counter
    who.className = "who" + (mine ? " mine" : ""); who.textContent = me ? "You can move the deck" : "Watching";
    $("where").textContent = `Scene ${state.index + 1}`;
    $("steps").innerHTML = Array.from({ length: (state.steps ?? 0) + 1 }, (_, k) => `<i class="${k <= step ? "on" : ""}"></i>`).join("");
    $("hint").textContent = "";
    renderMedia(mine);
    setBar(mine, "");
    return;
  }

  const ci = Math.min(step, Math.max(0, s.chunks.length - 1));
  const here = FLAT.findIndex((f) => f.si === state.index && f.ci === ci);
  const mineAt = FLAT.findIndex((f, k) => k > here && f.part === me);
  const away = mineAt > 0 ? mineAt - here : -1;
  who.className = "who" + (mine ? " mine" : away === 1 ? " soon" : "");
  who.textContent = mine ? "Your turn" : s.appendix ? "Backup slide: the lead answers" : `${nameOf(s.part) || "Nobody"} is speaking`;
  if (!mine && me) {
    const small = document.createElement("small");
    small.textContent = away === 1 ? " · you are next" : away > 0 ? ` · your turn in ${away} steps` : " · your part is done";
    who.append(small);
  }

  const main = SCENES.filter((x) => !x.appendix).length;
  $("where").textContent = s.appendix ? `Backup · ${s.title}` : `${state.index + 1}/${main} · ${s.title}`;
  $("steps").innerHTML = s.chunks.length > 1 ? s.chunks.map((_, k) => `<i class="${k <= ci ? "on" : ""}"></i>`).join("") : "";

  // the text of this step: yours big and bright, someone else's smaller and dimmed
  const text = s.chunks[ci];
  if (text) read.append(para(text, mine ? "mine" : me === 0 ? "watch" : "other"));
  else if (mine) read.append(para("Nothing to say here. Press Next when the animation stops.", "empty"));
  if (mine) {
    const after = s.chunks[ci + 1];
    if (after) read.append(para(after, "after", "Then:"));
  } else if (me && mineAt > 0 && away <= 3) {
    // a preview of your first line, so you can get ready
    const f = FLAT[mineAt], first = SCENES[f.si].chunks[f.ci];
    if (first) read.append(para(first, "after", "You start:"));
  }
  read.scrollTop = 0;

  // one line about what Next does, only when it is more than the next sentence
  let hint = "";
  if (mine) {
    const last = ci >= s.chunks.length - 1, nxt = SCENES[state.index + 1];
    if (last && !nxt) hint = "Last step. Finish the sentence.";
    else if (last && nxt.part !== s.part) hint = `Next hands over to ${nameOf(nxt.part)}.`;

    report();
    return;
  }
  lock = null; wake();
  // iPhone stops the camera in the background: back on the page, turn it on again
  if (CAM_ON && joined && camWanted && cam && !camLive()) { closeCam(); openCam().catch(() => {}); }
  if (!sock || sock.readyState > 1) { retry = 0; connect(); }
  else if (sock.readyState === 1) send("hello");
  if (recording() && me && hiddenAt) {
    const away = Date.now() - hiddenAt;
    const alive = recorder && recorder.state === "recording" && micLive();
    (async () => {
      if (!alive) { stopTake(); await startTake(); }
      gap("visible", !alive, away);
    })();
    hiddenAt = 0;
    buzz([200, 100, 200]);
    showAlert("You left the page during the recording",
      `For ${Math.round(away / 1000)} s your phone may not have recorded. It records again now. Keep this page open with the screen on until the lead stops.`, "Got it");
  }
  hiddenAt = 0;
  report();
});
function gap(st, resumed, hiddenMs) {
  if (sock && sock.readyState === 1) sock.send(JSON.stringify({ type: "rec-gap", part: me, state: st, at: Date.now(), offset: Math.round(clock.offset ?? 0), resumed, hiddenMs }));
}

function showAlert(h, p, btn, action) {
  $("alertH").textContent = h; $("alertP").textContent = p; $("alertBtn").textContent = btn || "OK";
  $("alert").hidden = false;
  $("alertBtn").onclick = () => { $("alert").hidden = true; wake(); if (action) action(); };
}

/* ------------------------------------------------------------------ phone health for the control page */

let battery = null;
if (navigator.getBattery) navigator.getBattery().then((b) => { battery = b; b.onlevelchange = b.onchargingchange = report; report(); }).catch(() => {});
function report() {
  if (!sock || sock.readyState !== 1 || me === null || me === undefined) return;
  sock.send(JSON.stringify({ type: "status", part: me,
    battery: battery ? Math.round(battery.level * 100) : null, charging: battery ? battery.charging : null,
    // "headphones" = the speaker tapped I'm ready under "Laptop on the call, headphones on"
    mic: micPerm, micOn: micLive(), muted: micMuted(), cam: camState(), headphones: joined && levelOn,
    recording: !!(recorder && recorder.state === "recording"), hidden: document.visibilityState === "hidden",
    queue: take ? take.queue.length : 0, rtt: clock.rtt, offset: clock.offset, mime: take ? take.mime : pickMime() }));
}
setInterval(report, 3000);

/* ------------------------------------------------------------------ deck commands */

function send(cmd) {
  if (sock && sock.readyState === 1) sock.send(JSON.stringify({ type: "cmd", cmd, part: me }));
  if (cmd !== "hello") buzz(12);
  wake();
}
function press(cmd) {
  send(cmd);
  const f = $("fwd"); f.classList.add("sent"); setTimeout(() => f.classList.remove("sent"), 180);
}
$("fwd").onclick = () => press("next");
$("back").onclick = () => press("prev");
// a Bluetooth clicker or keyboard paired with the phone
document.addEventListener("keydown", (e) => {
  if ($("talk").hidden || $("fwd").disabled) return;
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); press("next"); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); press("prev"); }
});
// no double-tap zoom on the buttons (iOS ignores user-scalable)
let lastTouch = 0;
document.addEventListener("touchend", (e) => { const now = Date.now(); if (now - lastTouch < 350 && e.target.closest("button")) e.preventDefault(); lastTouch = now; }, { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());

/* ------------------------------------------------------------------ connection and clock */

// clock offset to the server, NTP-style: offset = server - (sent + rtt/2); the sample with the smallest rtt wins
const clock = { offset: null, rtt: null, samples: [] };
function onPong(m) {
  const now = Date.now(), rtt = now - m.t;
  if (typeof m.server !== "number" || rtt < 0) return;
  clock.samples.push({ rtt, offset: m.server - (m.t + rtt / 2) });
  if (clock.samples.length > 16) clock.samples.shift();
  const best = clock.samples.reduce((a, b) => (b.rtt < a.rtt ? b : a));
  clock.rtt = Math.round(best.rtt); clock.offset = Math.round(best.offset);
}
const ping = () => { if (sock && sock.readyState === 1) sock.send(JSON.stringify({ type: "ping", t: Date.now() })); };

let retry = 0, retryTimer = null, lastMsg = 0;
function connect() {
  clearTimeout(retryTimer);
  if (sock && (sock.readyState === 0 || sock.readyState === 1)) return;
  const s = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?role=remote&k=${encodeURIComponent(key)}`);
  sock = s;
  s.onopen = () => {
    retry = 0; lastMsg = Date.now(); send("hello"); report(); render();
    for (let i = 0; i < 6; i++) setTimeout(ping, i * 250);   // a burst for a good first clock estimate
  };
  s.onmessage = (e) => {
    lastMsg = Date.now();
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === "pong") { onPong(m); return; }
    if (m.type === "state") { state = m.state; checkTurn(); }
    else if (m.type === "deck") deckOnline = m.online;
    else if (m.type === "scenes") { SCENES = m.scenes || []; if (m.speakers) SPEAKERS = m.speakers; flatten(); buildPicker(); wasMine = isMine(); }
    else if (m.type === "rec") onRec(m);
    else if (m.type === "team") { TEAM = m.list || []; renderTeam(); return; }
    else if (m.type === "thumb") { thumbs[m.part] = m.data; renderTeam(); return; }
    render();
  };
  s.onclose = () => {
    if (sock !== s) return;
    render();
    retryTimer = setTimeout(connect, Math.min(5000, 600 * 2 ** retry++));
  };
}
setInterval(() => {
  if (!sock || sock.readyState !== 1) return;
  if (Date.now() - lastMsg > 25000) { sock.close(); return; }
  ping();
}, 10000);
window.addEventListener("online", connect);

// keep the phone screen on while the remote is open
let lock = null;
async function wake() { try { if (!lock && navigator.wakeLock && document.visibilityState === "visible") { lock = await navigator.wakeLock.request("screen"); lock.onrelease = () => { lock = null; }; } } catch {} }
document.addEventListener("click", wake);

render();
connect();
wake();
</script>
</body>
</html>
